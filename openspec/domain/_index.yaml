concepts:
  - name: Change
    aliases: [change-proposal]
    related: [Artifact, Spec, Schema]
    states: [in-progress, complete, archived]
    rules: [tasks-required-before-apply]
    actors: [Developer]
    def: The core unit of work in OpenSpec — a named directory containing all artifacts that describe and implement a single improvement.
    file: static/concepts/change.md

  - name: Artifact
    aliases: []
    related: [Change, Schema]
    states: [pending, done]
    def: A generated document within a Change (e.g., proposal.md, design.md, tasks.md, specs/).
    file: static/concepts/artifact.md

  - name: Spec
    aliases: [capability-spec, delta-spec]
    related: [Change, Capability]
    def: A capability specification containing requirements and BDD-style scenarios (WHEN/THEN).
    file: static/concepts/spec.md

  - name: Skill
    aliases: [command, slash-command]
    related: [Schema, Change]
    def: A markdown instruction file stored in `openspec/skills/<name>/SKILL.md` that any capable AI agent or IDE can load and execute to implement an OpenSpec workflow command.
    file: static/concepts/skill.md

  - name: Schema
    aliases: [workflow-schema]
    related: [Artifact, Change]
    def: Defines the workflow type for a Change — which Artifact types exist, their dependencies, and which must be done before apply can run.
    file: static/concepts/schema.md

  - name: Discovery
    aliases: []
    related: [Change, Spec]
    states: [active, superseded, invalidated]
    rules: [discoveries-default-active]
    def: A domain fact surfaced during development, stored with provenance and a lifecycle status.
    file: static/concepts/discovery.md

processes:
  - name: ChangeProposal
    aliases: [propose]
    related: [Change, Artifact, Schema, Developer]
    def: The workflow for creating a new Change with all required Artifacts in one step, triggered by /opsx:propose.
    file: static/processes/change-proposal.md

  - name: ChangeApplication
    aliases: [apply]
    related: [Change, Artifact, Skill]
    rules: [tasks-required-before-apply, domain-loaded-on-entry, concept-files-by-name-only]
    def: The workflow for implementing a Change's tasks one by one, triggered by /opsx:apply.
    file: static/processes/change-application.md

  - name: ChangeArchival
    aliases: [archive]
    related: [Change, Spec, Discovery]
    rules: [index-never-hand-edited, discoveries-default-active]
    def: The workflow for finalizing a completed Change — domain review, spec sync, and directory move — triggered by /opsx:archive.
    file: static/processes/change-archival.md

glossary:
  - term: Delta spec
    def: A spec file inside a change directory that differs from or extends the corresponding main spec.

  - term: Frontmatter
    def: YAML metadata block delimited by --- at the top of a markdown file; parsed by skills to build the domain index.

  - term: Capability
    def: A named domain area used as the directory name under openspec/specs/.

  - term: Domain index
    def: The auto-generated openspec/domain/_index.yaml providing a token-efficient summary of all domain knowledge.

rules:
  - id: index-never-hand-edited
    def: _index.yaml must never be edited manually — always regenerated by /opsx:domain sync or /opsx:archive.

  - id: tasks-required-before-apply
    def: A change must have a completed tasks artifact before /opsx:apply can run.

  - id: domain-loaded-on-entry
    def: Every skill must load _index.yaml at the very start of execution when openspec/domain/ exists.

  - id: concept-files-by-name-only
    def: Skills load individual concept files only when the concept name appears in current change scope — never all files by default.

  - id: discoveries-default-active
    def: Newly captured discoveries must always be written with status active.

discoveries: []
